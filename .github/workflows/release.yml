name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Universal JAR & Debian Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shadow JAR
        run: ./gradlew shadowJar

      - name: Extract version without 'v' prefix
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Debian package with jpackage
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot
          mkdir -p dist
          jpackage --type deb \
            --name mcp-server \
            --input build/libs \
            --main-jar mcp-server-0.1.0-all.jar \
            --main-class MainKt \
            --app-version ${{ steps.get_version.outputs.VERSION }} \
            --dest dist

      - name: Upload Linux/Universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-artifacts
          path: |
            build/libs/*-all.jar
            dist/*.deb

  build-windows:
    name: Build Windows Executable & JAR
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK & GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Shadow JAR
        run: ./gradlew shadowJar

      - name: Prepare Windows JAR Artifact
        run: |
          mkdir dist-windows
          copy build\libs\*-all.jar dist-windows\mcp-server-windows.jar

      - name: Build Native Executable (GraalVM)
        continue-on-error: true
        run: ./gradlew nativeCompile

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist-windows\*.jar
            build\native\nativeCompile\*.exe

  release:
    name: Create GitHub Release & Upload Assets
    needs: [build-release, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            universal-artifacts/**/*
            windows-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
